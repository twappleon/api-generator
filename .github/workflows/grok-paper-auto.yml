name: Grok Paper Auto Safety
on:
  push:
    paths:
      - 'grok_paper_auto/**'
      - 'Dockerfile'
      - '.github/workflows/grok-paper-auto.yml'
  pull_request:
    paths:
      - 'grok_paper_auto/**'
      - 'Dockerfile'
      - '.github/workflows/grok-paper-auto.yml'
jobs:
  paper-only-bdd:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check grok_paper_auto/server.mjs
      - run: node --test grok_paper_auto/engine.test.mjs
      - run: node --test grok_paper_auto/dashboard-data.test.mjs
      - run: node --test grok_paper_auto/diagnostics.test.mjs
      - run: sudo mkdir -p /data && sudo chmod 777 /data
      - run: node --test grok_paper_auto/server.smoke.test.mjs
      - run: docker build --pull -f Dockerfile -t grok-paper-auto-safety .

  mobile-visual-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.55.0-noble
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
      - name: Prepare isolated mock data volume
        run: mkdir -p /data && chmod 777 /data
      - name: Verify iPhone portrait, landscape, compact and desktop
        run: node --test grok_paper_auto/dashboard.visual.test.mjs
      - name: Upload synthetic-data-only RWD screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grok-paper-dashboard-rwd
          path: qa-screenshots/*.png
          if-no-files-found: ignore
