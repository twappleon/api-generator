name: Quant Bot Go - offline safety tests
on:
  push:
    branches:
      - cursor/quant-bot-usdt-c6b3
    paths:
      - "quant_bot/**"
      - ".github/workflows/quant-bot-go.yml"
  pull_request:
    paths:
      - "quant_bot/**"
      - ".github/workflows/quant-bot-go.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Offline Go unit and race tests
        run: go test ./... -count=1 -race -v
      - name: Go static analysis
        run: go vet ./...
      - name: Legacy SMA backtest smoke test
        run: go run main.go backtest --config config.example.json --limit 300 --offline-sample
      - name: Legacy paper simulation smoke test
        run: go run main.go paper --config config.example.json --iterations 5 --sleep-seconds 0 --offline-sample
      - name: New Binance CLI dry run smoke test
        run: go run ./cmd/binance-spot order --symbol BTCUSDT --side BUY --type LIMIT --price 50000 --quantity 0.001 --client-order-id smoke-1
      - name: Explicit order-send guard (no credentials)
        run: |
          if go run ./cmd/binance-spot order --symbol BTCUSDT --side BUY --type LIMIT --price 50000 --quantity 0.001 --client-order-id smoke-2 --dry-run=false; then
            echo "SAFETY FAILURE: order guard bypassed"; exit 1
          fi
