name: Binance Paper MVP CI
on:
  push:
    branches:
      - feature/binance-hermes-paper-mvp-20261030
  pull_request:
    paths:
      - 'quant_bot/**'
      - 'Dockerfile'
      - 'railway.json'
      - '.github/workflows/binance-paper-mvp.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go test ./... -race -count=1
      - run: go vet ./...
      - run: go build ./cmd/research
      - run: test -f config.paper-budget50.json
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t binance-paper-mvp:test .
