name: Binance A/B Paper safety tests
on:
  push:
    branches: [cursor/quant-bot-usdt-c6b3]
    paths:
      - "quant_bot/cmd/paper-ab/**"
      - ".github/workflows/paper-ab-go.yml"
  pull_request:
    paths:
      - "quant_bot/cmd/paper-ab/**"
      - ".github/workflows/paper-ab-go.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: quant_bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: false
      - name: Paper A/B regression race tests, vet, build
        shell: bash
        run: |
          set -euo pipefail
          go test -race -count=1 ./cmd/paper-ab
          go vet ./cmd/paper-ab
          go build -o /tmp/paper-ab ./cmd/paper-ab
